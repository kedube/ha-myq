[project]
name = "ha-myq"
version = "0.04"
description = "Experimental MyQ integration derived from the Android app protocol"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = ["aiohttp>=3.12", "aiortc==1.16.0", "curl_cffi==0.15.0"]

# For the desktop sign-in helper and research tools, which import the installed package.
[project.optional-dependencies]
probe = ["certifi>=2025.1.31"]
browser = ["certifi>=2025.1.31", "playwright>=1.50,<2"]
curl = ["certifi>=2025.1.31", "curl_cffi==0.15.0"]

# For the checks: `pip install --group test` installs these without the project. The tests
# import the integration from the checkout; installing it as well (an editable install
# in particular) gives custom_components a path entry Home Assistant's loader cannot read.
[dependency-groups]
test = [
    "aiortc==1.16.0",
    "certifi>=2025.1.31",
    "curl_cffi==0.15.0",
    "homeassistant==2026.2.3",
    # Pinned: a new release can format differently or add checks and fail an unrelated push.
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-homeassistant-custom-component==0.13.316",
    "PyTurboJPEG==1.8.0",
    "ruff==0.17.6",
]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["custom_components/myq"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# curl_cffi's stubs are
# narrower than its runtime API, e.g. verify= accepts a CA bundle path.
module = "myq.api.curl_http"  # mypy roots the package at custom_components/
disable_error_code = ["arg-type"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components.myq*"]

[tool.setuptools.package-data]
"custom_components.myq" = ["*.json", "*.yaml", "translations/*.json", "www/*.js", "frontend/*.js", "frontend/i18n/*.json"]

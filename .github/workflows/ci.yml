name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs these checks before publishing

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # There is no requirements.txt; the test dependency group lives in pyproject.toml.
          cache-dependency-path: pyproject.toml

      # The live card's tests (tests/test_live_card.mjs) run under Node from pytest.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # The test group, without the project itself: the tests import the integration from
      # the checkout, and an editable install breaks Home Assistant's custom_components scan.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      # The release job runs the same script; a packaging failure shows up here first.
      - name: Build the release archives
        run: python scripts/package.py
